app = "rails-preview-demo"
primary_region = "nrt"

[build]

[deploy]
  release_command = "bin/rails db:prepare"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[checks.status]
  port = 3000
  type = "http"
  interval = "10s"
  timeout = "2s"
  grace_period = "30s"
  method = "GET"
  path = "/up"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
